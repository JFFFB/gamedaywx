<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GameDayWX — NCAA Football Stadium Weather</title>

  <!-- PWA Manifest & Mobile Theme -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0057B8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GameDayWX" />

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />

  <style>
    :root {
      --bg-dark: #040914;
      --surface: #0b1528;
      --surface-2: #12213d;
      --royal: #0057B8;
      --royal-deep: #00387A;
      --ok: #10B981;
      --warn: #F59E0B;
      --danger: #EF4444;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --border: rgba(148, 163, 184, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100dvh;
    }

    .pwa-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      font-size: 0.875rem;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }

    .pwa-banner.show { display: flex; }
    .pwa-banner.offline { background: #3b1d06; border-bottom-color: var(--warn); }
    .pwa-banner.update { background: #062e22; border-bottom-color: var(--ok); }

    .pwa-btn {
      background: var(--royal);
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
    }

    header.app-header {
      background: linear-gradient(135deg, var(--royal), var(--royal-deep));
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.125rem;
      letter-spacing: 0.02em;
    }

    .brand img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }

    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(4, 9, 20, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
    }

    main#app {
      padding: 16px;
      max-width: 1280px;
      margin: 0 auto;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .week-select,
    .team-filter,
    .chip-btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.875rem;
    }

    .team-filter { min-width: 200px; }

    .chip-btn {
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s, border-color 0.15s;
    }

    .chip-btn.active {
      background: var(--royal);
      border-color: #3b82f6;
    }

    .status-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
      font-size: 0.8125rem;
      color: var(--muted);
    }

    .compare-drawer {
      display: none;
      background: var(--surface);
      border: 1px solid #3b82f6;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .compare-drawer.show { display: block; }

    .compare-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .compare-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .compare-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 0.825rem;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }

    .game-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .matchup {
      font-weight: 700;
      font-size: 1rem;
      line-height: 1.3;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .icon-btn.active {
      background: var(--royal);
      border-color: #60a5fa;
    }

    .meta {
      font-size: 0.83rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: #cbd5e1;
    }

    .badge.hazard {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.45);
      color: #fcd34d;
    }

    .wx-summary {
      padding: 10px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      color: #f1f5f9;
    }

    .quarters-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.76rem;
      margin-top: 6px;
    }

    .quarters-table th,
    .quarters-table td {
      padding: 5px 4px;
      text-align: center;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    }

    .quarters-table th {
      color: var(--muted);
      font-weight: 600;
    }

    .quarters-table td:first-child,
    .quarters-table th:first-child {
      text-align: left;
      font-weight: 700;
    }

    .empty-state {
      color: var(--muted);
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>
  <div id="offlineBanner" class="pwa-banner offline" role="status" aria-live="polite">
    <span>Offline mode — showing cached GameDayWX schedules and forecasts.</span>
  </div>

  <div id="updateBanner" class="pwa-banner update" role="status" aria-live="polite">
    <span>A newer version of GameDayWX is ready.</span>
    <button id="reloadAppBtn" class="pwa-btn" type="button">Reload</button>
  </div>

  <header class="app-header">
    <div class="brand">
      <img src="./icon-192.png" alt="GameDayWX icon" width="32" height="32" />
      <span>GameDayWX</span>
    </div>
    <div class="sync-pill" id="syncStatus">
      <span class="sync-dot" id="syncDot"></span>
      <span id="syncText">Online</span>
    </div>
  </header>

  <main id="app">
    <div class="toolbar">
      <h1 style="margin:0;font-size:1.25rem;">2026 NCAA Stadium Weather</h1>
      <div class="controls">
        <input
          id="teamFilter"
          class="team-filter"
          type="search"
          placeholder="Filter team, stadium, city..."
          aria-label="Filter by team, stadium, or city"
        />
        <button id="favOnlyBtn" class="chip-btn" type="button" aria-pressed="false">★ Favorites</button>
        <button id="compareToggleBtn" class="chip-btn" type="button">Compare (0/4)</button>
        <select id="weekSelect" class="week-select" aria-label="Select 2026 week">
          <option value="1">Week 1 (Sep 5, 2026)</option>
          <option value="2">Week 2 (Sep 12, 2026)</option>
          <option value="3">Week 3 (Sep 19, 2026)</option>
          <option value="4">Week 4 (Sep 26, 2026)</option>
          <option value="5">Week 5 (Oct 3, 2026)</option>
          <option value="6">Week 6 (Oct 10, 2026)</option>
          <option value="7">Week 7 (Oct 17, 2026)</option>
          <option value="8">Week 8 (Oct 24, 2026)</option>
          <option value="9">Week 9 (Oct 31, 2026)</option>
          <option value="10">Week 10 (Nov 7, 2026)</option>
          <option value="11">Week 11 (Nov 14, 2026)</option>
          <option value="12">Week 12 (Nov 21, 2026)</option>
          <option value="13" selected>Week 13 (Nov 28, 2026)</option>
        </select>
      </div>
    </div>

    <div class="status-bar">
      <span id="scheduleSourceLabel">Loading schedule...</span>
      <span>Quarter breakdown: Kickoff (Q1) through Q4 (~50 min/qtr)</span>
    </div>

    <section id="compareDrawer" class="compare-drawer" aria-label="Side-by-side stadium comparison">
      <div class="compare-header">
        <strong>Side-by-Side Stadium Comparison (up to 4)</strong>
        <button id="clearCompareBtn" class="icon-btn" type="button">Clear All</button>
      </div>
      <div id="compareGrid" class="compare-grid"></div>
    </section>

    <div id="gamesContainer" class="games-grid">Loading schedule...</div>
  </main>

  <script>
    const ESPN_SCOREBOARD_URL =
      'https://site.web.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard';

    const WEEK_DATES_2026 = {
      1: ['20260903', '20260904', '20260905'],
      2: ['20260911', '20260912'],
      3: ['20260918', '20260919'],
      4: ['20260925', '20260926'],
      5: ['20261002', '20261003'],
      6: ['20261009', '20261010'],
      7: ['20261016', '20261017'],
      8: ['20261023', '20261024'],
      9: ['20261030', '20261031'],
      10: ['20261106', '20261107'],
      11: ['20261113', '20261114'],
      12: ['20261120', '20261121'],
      13: ['20261126', '20261127', '20261128']
    };

    const STADIUM_LOOKUP = {
      'BYU Cougars': { name: 'LaVell Edwards Stadium', city: 'Provo', state: 'UT', lat: 40.2575, lon: -111.6545, roof: 'Open', surface: 'Grass' },
      'Utah Utes': { name: 'Rice-Eccles Stadium', city: 'Salt Lake City', state: 'UT', lat: 40.7599, lon: -111.8488, roof: 'Open', surface: 'Turf' },
      'Ohio State Buckeyes': { name: 'Ohio Stadium', city: 'Columbus', state: 'OH', lat: 40.0017, lon: -83.0197, roof: 'Open', surface: 'Turf' },
      'Michigan Wolverines': { name: 'Michigan Stadium', city: 'Ann Arbor', state: 'MI', lat: 42.2658, lon: -83.7487, roof: 'Open', surface: 'Turf' },
      'Texas A&M Aggies': { name: 'Kyle Field', city: 'College Station', state: 'TX', lat: 30.6102, lon: -96.3404, roof: 'Open', surface: 'Grass' },
      'Texas Longhorns': { name: 'DKR-Texas Memorial Stadium', city: 'Austin', state: 'TX', lat: 30.2837, lon: -97.7325, roof: 'Open', surface: 'Turf' },
      'Iowa State Cyclones': { name: 'Jack Trice Stadium', city: 'Ames', state: 'IA', lat: 42.0140, lon: -93.6358, roof: 'Open', surface: 'Grass' },
      'Kansas State Wildcats': { name: 'Bill Snyder Family Stadium', city: 'Manhattan', state: 'KS', lat: 39.2020, lon: -96.5938, roof: 'Open', surface: 'Turf' },
      'Kansas Jayhawks': { name: 'David Booth Kansas Memorial Stadium', city: 'Lawrence', state: 'KS', lat: 38.9635, lon: -95.2463, roof: 'Open', surface: 'Turf' },
      'Florida State Seminoles': { name: 'Doak S. Campbell Stadium', city: 'Tallahassee', state: 'FL', lat: 30.4382, lon: -84.3044, roof: 'Open', surface: 'Grass' },
      'Alabama Crimson Tide': { name: 'Bryant-Denny Stadium', city: 'Tuscaloosa', state: 'AL', lat: 33.2084, lon: -87.5504, roof: 'Open', surface: 'Grass' },
      'Georgia Bulldogs': { name: 'Sanford Stadium', city: 'Athens', state: 'GA', lat: 33.9498, lon: -83.3734, roof: 'Open', surface: 'Grass' },
      'Notre Dame Fighting Irish': { name: 'Notre Dame Stadium', city: 'South Bend', state: 'IN', lat: 41.6984, lon: -86.2339, roof: 'Open', surface: 'Turf' },
      'Penn State Nittany Lions': { name: 'Beaver Stadium', city: 'University Park', state: 'PA', lat: 40.8122, lon: -77.8561, roof: 'Open', surface: 'Grass' },
      'Oregon Ducks': { name: 'Autzen Stadium', city: 'Eugene', state: 'OR', lat: 44.0582, lon: -123.0685, roof: 'Open', surface: 'Turf' },
      'Syracuse Orange': { name: 'JMA Wireless Dome', city: 'Syracuse', state: 'NY', lat: 43.0362, lon: -76.1363, roof: 'Indoor / Dome', surface: 'Turf' }
    };

    const FALLBACK_GAMES_2026 = [
      {
        id: 'cin-at-byu-20261128',
        week: 13,
        kickoffIso: '2026-11-28T20:30:00Z',
        matchup: 'Cincinnati Bearcats at BYU Cougars',
        homeTeam: 'BYU Cougars',
        awayTeam: 'Cincinnati Bearcats',
        network: 'FOX',
        stadium: STADIUM_LOOKUP['BYU Cougars']
      },
      {
        id: 'wvu-at-utah-20261128',
        week: 13,
        kickoffIso: '2026-11-28T22:30:00Z',
        matchup: 'West Virginia Mountaineers at Utah Utes',
        homeTeam: 'Utah Utes',
        awayTeam: 'West Virginia Mountaineers',
        network: 'ESPN',
        stadium: STADIUM_LOOKUP['Utah Utes']
      },
      {
        id: 'mich-at-osu-20261128',
        week: 13,
        kickoffIso: '2026-11-28T17:00:00Z',
        matchup: 'Michigan Wolverines at Ohio State Buckeyes',
        homeTeam: 'Ohio State Buckeyes',
        awayTeam: 'Michigan Wolverines',
        network: 'FOX',
        stadium: STADIUM_LOOKUP['Ohio State Buckeyes']
      },
      {
        id: 'tex-at-tamu-20261128',
        week: 13,
        kickoffIso: '2026-11-28T20:30:00Z',
        matchup: 'Texas Longhorns at Texas A&M Aggies',
        homeTeam: 'Texas A&M Aggies',
        awayTeam: 'Texas Longhorns',
        network: 'ABC',
        stadium: STADIUM_LOOKUP['Texas A&M Aggies']
      },
      {
        id: 'ksu-at-isu-20261128',
        week: 13,
        kickoffIso: '2026-11-28T19:00:00Z',
        matchup: 'Kansas State Wildcats at Iowa State Cyclones',
        homeTeam: 'Iowa State Cyclones',
        awayTeam: 'Kansas State Wildcats',
        network: 'FS1',
        stadium: STADIUM_LOOKUP['Iowa State Cyclones']
      },
      {
        id: 'uf-at-fsu-20261128',
        week: 13,
        kickoffIso: '2026-11-28T23:00:00Z',
        matchup: 'Florida Gators at Florida State Seminoles',
        homeTeam: 'Florida State Seminoles',
        awayTeam: 'Florida Gators',
        network: 'ESPN',
        stadium: STADIUM_LOOKUP['Florida State Seminoles']
      },
      {
        id: 'byu-at-ku-20261121',
        week: 12,
        kickoffIso: '2026-11-21T17:00:00Z',
        matchup: 'BYU Cougars at Kansas Jayhawks',
        homeTeam: 'Kansas Jayhawks',
        awayTeam: 'BYU Cougars',
        network: 'ESPN',
        stadium: STADIUM_LOOKUP['Kansas Jayhawks']
      }
    ];

    let currentWeekGames = [];
    const weatherCacheById = new Map();
    const favoritesSet = new Set(JSON.parse(localStorage.getItem('gamedaywx_favorites') || '[]'));
    const compareIds = [];
    let favoritesOnly = false;
    let compareOpen = false;

    function saveFavorites() {
      localStorage.setItem('gamedaywx_favorites', JSON.stringify([...favoritesSet]));
    }

    function normalizeEspnEvent(event, week) {
      const comp = event.competitions?.[0];
      if (!comp) return null;

      const home = comp.competitors?.find((c) => c.homeAway === 'home');
      const away = comp.competitors?.find((c) => c.homeAway === 'away');
      const homeName = home?.team?.displayName || 'Home';
      const awayName = away?.team?.displayName || 'Away';
      const lookup = STADIUM_LOOKUP[homeName] || {};
      const venue = comp.venue || {};
      const addr = venue.address || {};

      const lat = venue.coordinates?.latitude ?? lookup.lat ?? null;
      const lon = venue.coordinates?.longitude ?? lookup.lon ?? null;

      const network =
        comp.broadcasts?.[0]?.names?.[0] ||
        comp.geoBroadcasts?.[0]?.media?.shortName ||
        'TBD';

      return {
        id: String(event.id),
        week,
        kickoffIso: event.date || comp.date,
        matchup: `${awayName} at ${homeName}`,
        homeTeam: homeName,
        awayTeam: awayName,
        network,
        stadium: {
          name: venue.fullName || lookup.name || `${homeName} Stadium`,
          city: addr.city || lookup.city || '',
          state: addr.state || lookup.state || '',
          lat,
          lon,
          roof: venue.indoor ? 'Indoor / Dome' : (lookup.roof || 'Open'),
          surface: comp.grass === true ? 'Grass' : comp.grass === false ? 'Turf' : (lookup.surface || 'Open')
        }
      };
    }

    async function fetchSingleDayEspn(yyyymmdd) {
      const url = `${ESPN_SCOREBOARD_URL}?seasontype=2&dates=${yyyymmdd}&limit=100`;
      const res = await fetch(url, { headers: { Accept: 'application/json' } });
      if (!res.ok) throw new Error(`ESPN HTTP ${res.status}`);
      const data = await res.json();
      return Array.isArray(data.events) ? data.events : [];
    }

    async function loadWeekGames(week) {
      const cacheKey = `gamedaywx_w${week}_v6`;
      const dates = WEEK_DATES_2026[week] || ['20261128'];
      const sourceLabel = document.getElementById('scheduleSourceLabel');

      if (navigator.onLine) {
        try {
          let allEvents = [];

          // 1. Primary query: season year + week
          const weekUrl = `${ESPN_SCOREBOARD_URL}?seasontype=2&dates=2026&week=${week}&limit=200`;
          const weekRes = await fetch(weekUrl, { headers: { Accept: 'application/json' } });
          if (weekRes.ok) {
            const weekData = await weekRes.json();
            if (Array.isArray(weekData.events) && weekData.events.length > 0) {
              allEvents = weekData.events;
            }
          }

          // 2. Secondary query: single-day dates if week query returned empty
          if (allEvents.length === 0) {
            const dayResults = await Promise.allSettled(dates.map((d) => fetchSingleDayEspn(d)));
            allEvents = dayResults
              .filter((r) => r.status === 'fulfilled')
              .flatMap((r) => r.value);
          }

          const seen = new Set();
          const games = allEvents
            .filter((ev) => {
              if (!ev?.id || seen.has(ev.id)) return false;
              seen.add(ev.id);
              return true;
            })
            .map((ev) => normalizeEspnEvent(ev, week))
            .filter(Boolean)
            .sort((a, b) => new Date(a.kickoffIso) - new Date(b.kickoffIso));

          if (games.length > 0) {
            localStorage.setItem(cacheKey, JSON.stringify({ savedAt: Date.now(), games }));
            if (sourceLabel) sourceLabel.textContent = `Live ESPN 2026 Schedule • ${games.length} games`;
            return games;
          }
        } catch (_) {}
      }

      try {
        const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
        if (cached && Array.isArray(cached.games) && cached.games.length > 0) {
          if (sourceLabel) sourceLabel.textContent = `Cached Schedule • ${cached.games.length} games`;
          return cached.games;
        }
      } catch (_) {}

      const fallbackForWeek = FALLBACK_GAMES_2026.filter((g) => Number(g.week) === Number(week));
      const list = fallbackForWeek.length > 0 ? fallbackForWeek : FALLBACK_GAMES_2026;
      if (sourceLabel) sourceLabel.textContent = `Featured 2026 Slate • ${list.length} games`;
      return list;
    }

    function detectHazards(quarters) {
      const hazards = [];
      const maxWind = Math.max(...quarters.map((q) => q.wind ?? 0));
      const maxPrecip = Math.max(...quarters.map((q) => q.precip ?? 0));
      const minTemp = Math.min(...quarters.map((q) => q.temp ?? 70));
      const maxTemp = Math.max(...quarters.map((q) => q.temp ?? 70));

      if (maxWind >= 18) hazards.push(`Windy (${Math.round(maxWind)} mph)`);
      if (maxPrecip >= 40) hazards.push(`Wet (${maxPrecip}% precip)`);
      if (minTemp <= 35) hazards.push(`Cold (${Math.round(minTemp)}°F)`);
      if (maxTemp >= 88) hazards.push(`Heat (${Math.round(maxTemp)}°F)`);
      return hazards;
    }

    async function fetchGameWeather(game) {
      if (weatherCacheById.has(game.id)) {
        return weatherCacheById.get(game.id);
      }

      if (game.stadium.roof === 'Indoor / Dome') {
        const domeResult = {
          summary: 'Indoor / Dome — 70°F • Controlled environment',
          hazards: [],
          quarters: [
            { label: 'Q1', temp: 70, wind: 0, precip: 0 },
            { label: 'Q2', temp: 70, wind: 0, precip: 0 },
            { label: 'Q3', temp: 70, wind: 0, precip: 0 },
            { label: 'Q4', temp: 70, wind: 0, precip: 0 }
          ]
        };
        weatherCacheById.set(game.id, domeResult);
        return domeResult;
      }

      if (game.stadium.lat == null || game.stadium.lon == null) {
        return { summary: 'Stadium coordinates unavailable', hazards: [], quarters: [] };
      }

      const kickoff = new Date(game.kickoffIso);
      if (Number.isNaN(kickoff.getTime())) {
        return { summary: 'Kickoff time TBD', hazards: [], quarters: [] };
      }

      const endGame = new Date(kickoff.getTime() + 3.5 * 3600 * 1000);
      const startDate = kickoff.toISOString().slice(0, 10);
      const endDate = endGame.toISOString().slice(0, 10);
      const todayUtc = new Date().toISOString().slice(0, 10);

      const isArchive = endDate < todayUtc;
      const baseUrl = isArchive
        ? 'https://archive-api.open-meteo.com/v1/archive'
        : 'https://api.open-meteo.com/v1/forecast';

      const hourlyFields = isArchive
        ? 'temperature_2m,precipitation,wind_speed_10m'
        : 'temperature_2m,precipitation_probability,wind_speed_10m';

      const params = new URLSearchParams({
        latitude: String(game.stadium.lat),
        longitude: String(game.stadium.lon),
        hourly: hourlyFields,
        temperature_unit: 'fahrenheit',
        wind_speed_unit: 'mph',
        start_date: startDate,
        end_date: endDate,
        timezone: 'UTC'
      });

      try {
        const res = await fetch(`${baseUrl}?${params.toString()}`);
        if (!res.ok) throw new Error('Weather HTTP error');
        const data = await res.json();
        const times = data.hourly?.time || [];
        const temps = data.hourly?.temperature_2m || [];
        const winds = data.hourly?.wind_speed_10m || [];
        const precips = data.hourly?.precipitation_probability || data.hourly?.precipitation || [];

        const quarterOffsetsMin = [0, 50, 115, 165];
        const quarterLabels = ['Q1', 'Q2', 'Q3', 'Q4'];

        const quarters = quarterOffsetsMin.map((offsetMin, idx) => {
          const targetMs = kickoff.getTime() + offsetMin * 60 * 1000;
          let bestIdx = 0;
          let bestDiff = Infinity;
          for (let i = 0; i < times.length; i++) {
            const diff = Math.abs(new Date(`${times[i]}Z`).getTime() - targetMs);
            if (diff < bestDiff) {
              bestDiff = diff;
              bestIdx = i;
            }
          }
          return {
            label: quarterLabels[idx],
            temp: temps[bestIdx] ?? null,
            wind: winds[bestIdx] ?? null,
            precip: precips[bestIdx] ?? 0
          };
        });

        const q1 = quarters[0] || {};
        const parts = [];
        if (q1.temp != null) parts.push(`Kickoff ${Math.round(q1.temp)}°F`);
        if (q1.wind != null) parts.push(`Wind ${Math.round(q1.wind)} mph`);
        if (q1.precip != null) parts.push(isArchive ? `Precip ${q1.precip} mm` : `Precip ${q1.precip}%`);

        const result = {
          summary: parts.length ? parts.join(' • ') : 'Forecast unavailable',
          hazards: detectHazards(quarters),
          quarters
        };
        weatherCacheById.set(game.id, result);
        return result;
      } catch (_) {
        return { summary: 'Forecast unavailable', hazards: [], quarters: [] };
      }
    }

    function formatKickoff(isoString) {
      const dt = new Date(isoString);
      if (Number.isNaN(dt.getTime())) return 'TBD';
      return dt.toLocaleString(undefined, {
        weekday: 'short',
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        timeZoneName: 'short'
      });
    }

    function updateCompareDrawer() {
      const drawer = document.getElementById('compareDrawer');
      const grid = document.getElementById('compareGrid');
      const toggleBtn = document.getElementById('compareToggleBtn');
      if (toggleBtn) {
        toggleBtn.textContent = `Compare (${compareIds.length}/4)`;
        toggleBtn.classList.toggle('active', compareOpen);
      }
      if (!drawer || !grid) return;

      drawer.classList.toggle('show', compareOpen && compareIds.length > 0);
      grid.innerHTML = '';

      for (const id of compareIds) {
        const game = currentWeekGames.find((g) => g.id === id);
        if (!game) continue;
        const wx = weatherCacheById.get(id);
        const col = document.createElement('div');
        col.className = 'compare-card';
        col.innerHTML = `
          <div style="font-weight:700;margin-bottom:4px;">${game.matchup}</div>
          <div style="color:#94a3b8;margin-bottom:6px;">${game.stadium.name}</div>
          <div>${wx ? wx.summary : 'Loading weather...'}</div>
        `;
        grid.appendChild(col);
      }
    }

    function renderWeatherInsideCard(game, wx) {
      const wxEl = document.getElementById(`wx-${game.id}`);
      const badgeEl = document.getElementById(`badges-${game.id}`);
      if (!wxEl) return;

      if (badgeEl && wx.hazards?.length) {
        for (const h of wx.hazards) {
          const span = document.createElement('span');
          span.className = 'badge hazard';
          span.textContent = h;
          badgeEl.appendChild(span);
        }
      }

      if (!wx.quarters || wx.quarters.length === 0) {
        wxEl.textContent = wx.summary;
        return;
      }

      const rowsHtml = wx.quarters
        .map(
          (q) => `
          <tr>
            <td>${q.label}</td>
            <td>${q.temp != null ? `${Math.round(q.temp)}°F` : '—'}</td>
            <td>${q.wind != null ? `${Math.round(q.wind)} mph` : '—'}</td>
            <td>${q.precip != null ? `${q.precip}%` : '—'}</td>
          </tr>
        `
        )
        .join('');

      wxEl.innerHTML = `
        <div style="font-weight:600;margin-bottom:4px;">${wx.summary}</div>
        <table class="quarters-table" aria-label="Quarter-by-quarter forecast">
          <thead>
            <tr><th>Qtr</th><th>Temp</th><th>Wind</th><th>Precip</th></tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      `;
    }

    function renderFilteredGames() {
      const container = document.getElementById('gamesContainer');
      const filterInput = document.getElementById('teamFilter');
      if (!container) return;

      const query = (filterInput?.value || '').trim().toLowerCase();
      const filtered = currentWeekGames.filter((g) => {
        if (favoritesOnly && !favoritesSet.has(g.id)) return false;
        if (!query) return true;
        const haystack = [
          g.matchup,
          g.homeTeam,
          g.awayTeam,
          g.stadium.name,
          g.stadium.city,
          g.stadium.state
        ]
          .join(' ')
          .toLowerCase();
        return haystack.includes(query);
      });

      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML =
          '<div class="empty-state">No matching games found. Clear the search filter or turn off Favorites-only view.</div>';
        return;
      }

      for (const game of filtered) {
        const card = document.createElement('article');
        card.className = 'game-card';
        const loc = [game.stadium.city, game.stadium.state].filter(Boolean).join(', ');
        const isFav = favoritesSet.has(game.id);
        const isComp = compareIds.includes(game.id);

        card.innerHTML = `
          <div class="card-top">
            <div class="matchup">${game.matchup}</div>
            <div class="card-actions">
              <button class="icon-btn ${isFav ? 'active' : ''}" data-action="fav" data-id="${game.id}" type="button" title="Favorite game">${isFav ? '★' : '☆'}</button>
              <button class="icon-btn ${isComp ? 'active' : ''}" data-action="cmp" data-id="${game.id}" type="button" title="Compare stadium">${isComp ? '✓ Cmp' : '+ Cmp'}</button>
            </div>
          </div>
          <div class="meta">
            <div>${formatKickoff(game.kickoffIso)} • ${game.network}</div>
            <div>${game.stadium.name}${loc ? ` (${loc})` : ''}</div>
          </div>
          <div class="badges" id="badges-${game.id}">
            <span class="badge">${game.stadium.roof}</span>
            <span class="badge">${game.stadium.surface}</span>
          </div>
          <div class="wx-summary" id="wx-${game.id}">Checking stadium weather...</div>
        `;
        container.appendChild(card);

        fetchGameWeather(game).then((wx) => {
          renderWeatherInsideCard(game, wx);
          if (compareIds.includes(game.id)) updateCompareDrawer();
        });
      }
    }

    async function renderSchedule(week) {
      const container = document.getElementById('gamesContainer');
      if (!container) return;
      container.innerHTML = 'Loading schedule...';

      currentWeekGames = await loadWeekGames(week);
      renderFilteredGames();
      updateCompareDrawer();
    }

    (() => {
      const offlineBanner = document.getElementById('offlineBanner');
      const updateBanner = document.getElementById('updateBanner');
      const reloadBtn = document.getElementById('reloadAppBtn');
      const syncDot = document.getElementById('syncDot');
      const syncText = document.getElementById('syncText');
      const weekSelect = document.getElementById('weekSelect');
      const teamFilter = document.getElementById('teamFilter');
      const favOnlyBtn = document.getElementById('favOnlyBtn');
      const compareToggleBtn = document.getElementById('compareToggleBtn');
      const clearCompareBtn = document.getElementById('clearCompareBtn');
      const gamesContainer = document.getElementById('gamesContainer');

      function updateOnlineIndicator() {
        const online = navigator.onLine;
        offlineBanner.classList.toggle('show', !online);
        if (syncDot && syncText) {
          syncDot.style.background = online ? '#10B981' : '#F59E0B';
          syncText.textContent = online ? 'Online' : 'Cached';
        }
      }

      window.addEventListener('online', updateOnlineIndicator);
      window.addEventListener('offline', updateOnlineIndicator);
      updateOnlineIndicator();

      if (weekSelect) {
        weekSelect.addEventListener('change', (e) => renderSchedule(Number(e.target.value)));
      }

      if (teamFilter) {
        teamFilter.addEventListener('input', renderFilteredGames);
      }

      if (favOnlyBtn) {
        favOnlyBtn.addEventListener('click', () => {
          favoritesOnly = !favoritesOnly;
          favOnlyBtn.classList.toggle('active', favoritesOnly);
          favOnlyBtn.setAttribute('aria-pressed', String(favoritesOnly));
          renderFilteredGames();
        });
      }

      if (compareToggleBtn) {
        compareToggleBtn.addEventListener('click', () => {
          compareOpen = !compareOpen;
          updateCompareDrawer();
        });
      }

      if (clearCompareBtn) {
        clearCompareBtn.addEventListener('click', () => {
          compareIds.length = 0;
          compareOpen = false;
          updateCompareDrawer();
          renderFilteredGames();
        });
      }

      if (gamesContainer) {
        gamesContainer.addEventListener('click', (e) => {
          const btn = e.target.closest('button[data-action]');
          if (!btn) return;
          const id = btn.getAttribute('data-id');
          const action = btn.getAttribute('data-action');
          if (!id) return;

          if (action === 'fav') {
            if (favoritesSet.has(id)) favoritesSet.delete(id);
            else favoritesSet.add(id);
            saveFavorites();
            renderFilteredGames();
          } else if (action === 'cmp') {
            const idx = compareIds.indexOf(id);
            if (idx >= 0) {
              compareIds.splice(idx, 1);
            } else if (compareIds.length < 4) {
              compareIds.push(id);
              compareOpen = true;
            }
            updateCompareDrawer();
            renderFilteredGames();
          }
        });
      }

      window.addEventListener('DOMContentLoaded', () => {
        renderSchedule(Number(weekSelect?.value || 13));
      });

      if ('serviceWorker' in navigator) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });

        window.addEventListener('load', async () => {
          try {
            const registration = await navigator.serviceWorker.register('./sw.js', { scope: './' });
            const promptIfWaiting = (worker) => {
              if (worker && navigator.serviceWorker.controller) {
                updateBanner.classList.add('show');
                reloadBtn.onclick = () => worker.postMessage({ type: 'SKIP_WAITING' });
              }
            };
            if (registration.waiting) promptIfWaiting(registration.waiting);
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed') promptIfWaiting(newWorker);
              });
            });
          } catch (err) {
            console.warn('GameDayWX service worker registration failed:', err);
          }
        });
      }
    })();
  </script>
</body>
