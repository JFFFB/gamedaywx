<script>
  const ESPN_CFB_SCOREBOARD =
    'https://site.web.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard';

  // Optional local fallback used only if ESPN is unreachable and no cache exists
  const FALLBACK_SCHEDULE_2026 = [
    {
      id: 'fallback-byu-cin-20261128',
      week: 13,
      kickoffIso: '2026-11-28T20:30:00Z',
      matchup: 'Cincinnati Bearcats at BYU Cougars',
      homeTeam: 'BYU Cougars',
      awayTeam: 'Cincinnati Bearcats',
      network: 'ESPN/ABC',
      stadium: {
        name: 'LaVell Edwards Stadium',
        city: 'Provo',
        state: 'UT',
        lat: 40.2575,
        lon: -111.6545,
        elevationM: 1413,
        surface: 'Grass',
        roof: 'Open'
      }
    }
  ];

  function formatKickoffLocal(isoString, timeZone = undefined) {
    const dt = new Date(isoString);
    if (Number.isNaN(dt.getTime())) return 'TBD';
    return new Intl.DateTimeFormat(undefined, {
      weekday: 'short',
      month: 'short',
      day: 'numeric',
      hour: 'numeric',
      minute: '2-digit',
      timeZoneName: 'short',
      ...(timeZone ? { timeZone } : {})
    }).format(dt);
  }

  function normalizeEspnEvent(event, fallbackWeek) {
    const comp = event.competitions?.[0];
    if (!comp) return null;

    const home = comp.competitors?.find((c) => c.homeAway === 'home');
    const away = comp.competitors?.find((c) => c.homeAway === 'away');
    const venue = comp.venue || {};
    const addr = venue.address || {};

    const broadcastNames = (comp.broadcasts || [])
      .flatMap((b) => b.names || [])
      .filter(Boolean);
    const geoNames = (comp.geoBroadcasts || [])
      .map((g) => g.media?.shortName || g.media?.name)
      .filter(Boolean);
    const network = [...new Set([...broadcastNames, ...geoNames])].join(', ') || 'TBD';

    return {
      id: String(event.id),
      week: event.week?.number ?? fallbackWeek ?? null,
      kickoffIso: event.date || comp.date,
      status: event.status?.type?.name || 'STATUS_SCHEDULED',
      matchup: `${away?.team?.displayName || 'Away'} at ${home?.team?.displayName || 'Home'}`,
      homeTeam: home?.team?.displayName || 'Home',
      awayTeam: away?.team?.displayName || 'Away',
      network,
      stadium: {
        name: venue.fullName || `${home?.team?.location || 'Home'} Stadium`,
        city: addr.city || '',
        state: addr.state || '',
        lat: venue.coordinates?.latitude ?? null,
        lon: venue.coordinates?.longitude ?? null,
        elevationM: venue.elevation ?? null,
        surface: comp.grass === true ? 'Grass' : comp.grass === false ? 'Turf' : 'TBD',
        roof: venue.indoor === true ? 'Indoor / Dome' : 'Open'
      }
    };
  }

  /**
   * Fetches live 2026 regular-season NCAA football games from ESPN.
   * Pass { week: 13 } OR { dates: '20261126-20261130' }.
   */
  async function fetchLiveNcaaSchedule({ week = 13, dates = null, seasonYear = 2026 } = {}) {
    const params = new URLSearchParams({
      seasontype: '2',
      limit: '250'
    });

    if (dates) {
      params.set('dates', dates);
    } else {
      params.set('week', String(week));
      params.set('dates', String(seasonYear));
    }

    const url = `${ESPN_CFB_SCOREBOARD}?${params.toString()}`;
    const storageKey = `gamedaywx_schedule_${seasonYear}_w${week}_${dates || 'all'}`;

    try {
      const res = await fetch(url, { headers: { Accept: 'application/json' } });
      if (!res.ok) {
        throw new Error(`ESPN scoreboard HTTP ${res.status}`);
      }
      const data = await res.json();
      const games = (data.events || [])
        .map((ev) => normalizeEspnEvent(ev, week))
        .filter(Boolean)
        .sort((a, b) => new Date(a.kickoffIso) - new Date(b.kickoffIso));

      if (games.length > 0) {
        localStorage.setItem(storageKey, JSON.stringify({ updatedAt: Date.now(), games }));
        return games;
      }
      throw new Error('No events returned for query');
    } catch (err) {
      console.warn('Live schedule fetch fell back to cache/seed:', err.message);
      const cached = localStorage.getItem(storageKey);
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          if (Array.isArray(parsed.games) && parsed.games.length > 0) {
            return parsed.games;
          }
        } catch (_) {}
      }
      return FALLBACK_SCHEDULE_2026;
    }
  }

  // Example usage: load Week 13 (Nov 26–30, 2026) and render kickoff times
  window.addEventListener('DOMContentLoaded', async () => {
    const games = await fetchLiveNcaaSchedule({ week: 13, dates: '20261126-20261130' });
    console.log('Loaded live NCAA games:', games.length, games.slice(0, 5));
    // Connect `games` into your existing renderGames(games) and Open-Meteo forecast loop
  });
</script>
